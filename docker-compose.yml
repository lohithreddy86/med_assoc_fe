version: '3.8'

services:
  # ==========================================================================
  # Frontend - React Application
  # ==========================================================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ocr-snipping-frontend
    ports:
      - "3000:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - ocr-network

  # ==========================================================================
  # Frontend Development Mode (optional - use for local development)
  # ==========================================================================
  frontend-dev:
    image: node:18-alpine
    container_name: ocr-snipping-frontend-dev
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
    command: sh -c "npm install && npm start"
    profiles:
      - dev
    networks:
      - ocr-network

networks:
  ocr-network:
    driver: bridge
